services:
  - type: web
    name: icash-server
    env: node
    plan: free
    buildCommand: npm install && npx prisma db push --schema=backend/prisma/schema.prisma --skip-generate && node scripts/build.js
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: https://icash.onrender.com,https://icash-server.onrender.com
      - key: SMS_PROVIDER
        value: twilio
      - key: BIOMETRIC_PROVIDER
        value: demo
      - key: ALLOW_DEMO_TOPUP
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true

  - type: web
    name: icash-liveness
    env: python
    rootDir: liveness_server
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 app:app
    envVars:
      - key: LIVENESS_ALLOWED_ORIGINS
        value: https://icash.onrender.com,https://icash-server.onrender.com
