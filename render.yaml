services:
  - type: web
    name: icash-server
    env: node
    plan: free
    buildCommand: npm install && node scripts/build.js
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: "*"
      - key: SMS_PROVIDER
        value: console
      - key: BIOMETRIC_PROVIDER
        value: demo
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
