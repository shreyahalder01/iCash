services:
  - type: web
    name: icash-server
    env: node
    plan: free
    buildCommand: npm install && npx prisma db push --schema=backend/prisma/schema.prisma --skip-generate && node scripts/build.js
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: https://icash.onrender.com
      - key: SMS_PROVIDER
        value: twilio
      - key: BIOMETRIC_PROVIDER
        value: demo
      - key: ALLOW_DEMO_TOPUP
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
