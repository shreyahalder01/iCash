services:
  postgres:
    image: postgres:16-alpine
    container_name: icash-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: icash
    ports:
      - "5433:5432"
    volumes:
      - icash_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d icash"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  icash_pgdata:
    driver: local
