services:
  icash-server:
    build: .
    container_name: icash-server
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/icash?schema=public
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in the environment}
      - SESSION_SECRET=${SESSION_SECRET:?Set SESSION_SECRET in the environment}
      - CORS_ORIGIN=${CORS_ORIGIN:?Set CORS_ORIGIN in the environment}
      - SMS_PROVIDER=console
      - BIOMETRIC_PROVIDER=demo
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: icash-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}
      POSTGRES_DB: icash
    ports:
      - "5432:5432"
    volumes:
      - icash_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d icash"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  icash_pgdata:
    driver: local
