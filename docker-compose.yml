services:
  icash-server:
    build: .
    container_name: icash-server
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/icash?schema=public
      - JWT_SECRET=icash-super-secure-production-jwt-secret-key-2026
      - SESSION_SECRET=icash-session-cookie-encryption-secret-2026
      - CORS_ORIGIN=*
      - SMS_PROVIDER=console
      - BIOMETRIC_PROVIDER=demo
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: icash-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: icash
    ports:
      - "5432:5432"
    volumes:
      - icash_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d icash"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  icash_pgdata:
    driver: local
